<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>You Lost It, We've Found It</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="logo.png" alt="School Logo" class="logo">
    <h1>You Lost It, We've Found It</h1>
    <nav>
      <button onclick="showTab('report')" id="btn-report">Report</button>
      <button onclick="showTab('lost')" id="btn-lost">Lost</button>
      <button onclick="showTab('found')" id="btn-found">Found</button>
    </nav>
  </header>

  <main class="container">
    <!-- Report Form -->
    <section id="report" class="tab">
      <h2>Report Item</h2>
      <form id="itemForm" class="form-box">
        <label>Type</label>
        <select id="type">
          <option value="lost">Lost</option>
          <option value="found">Found</option>
        </select>

        <label>Item Name</label>
        <input type="text" id="name" required>

        <label>Description</label>
        <textarea id="description" rows="3" required></textarea>

        <label>Date</label>
        <input type="date" id="date" required>

        <label>Place</label>
        <input type="text" id="place" required>

        <label>Contact</label>
        <input type="text" id="contact" required>

        <label>Image (optional)</label>
        <input type="file" id="image" accept="image/*">

        <button type="submit" class="primary-btn">Upload</button>
      </form>
    </section>

    <!-- Lost Items -->
    <section id="lost" class="tab" style="display:none;">
      <h2>Lost Items</h2>
      <div class="items" id="lostItems"></div>
    </section>

    <!-- Found Items -->
    <section id="found" class="tab" style="display:none;">
      <h2>Found Items</h2>
      <div class="items" id="foundItems"></div>
    </section>
  </main>

  <footer>
    <p>© 2025 Renier Van Rooi. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
