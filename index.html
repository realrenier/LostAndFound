<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>You Lost It, We've Found It</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="logo.png" alt="School Logo" class="logo">
    <h1>You Lost It, We've Found It</h1>
  </header>

  <div class="container">
    <!-- Upload Form -->
    <div class="form-box">
      <h2>Report Item</h2>
      <form id="itemForm">
        <label>Type:</label>
        <select id="type">
          <option value="lost">Lost</option>
          <option value="found">Found</option>
        </select><br><br>

        <label>Item Name:</label>
        <input type="text" id="name" required><br><br>

        <label>Description:</label>
        <textarea id="description" rows="3" required></textarea><br><br>

        <label>Date:</label>
        <input type="date" id="date" required><br><br>

        <label>Place:</label>
        <input type="text" id="place" required><br><br>

        <label>Contact:</label>
        <input type="text" id="contact" required><br><br>

        <label>Image (optional):</label>
        <input type="file" id="image" accept="image/*"><br><br>

        <button type="submit">Upload</button>
      </form>
    </div>

    <!-- Dropdown Filter -->
    <label>Show:</label>
    <select id="filter">
      <option value="all">All Items</option>
      <option value="lost">Lost</option>
      <option value="found">Found</option>
    </select>

    <!-- Items Display -->
    <div class="items" id="items"></div>
  </div>

  <footer>
    <p>© 2025 Renier Van Rooi. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
